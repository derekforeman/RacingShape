# fly.toml app configuration file generated for racingshape on 2026-06-03T02:51:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'racingshape'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/racingshape.db'
  NODE_ENV = 'production'
  PORT = '8787'
  TZ = 'America/New_York'
  WEB_DIST = '/app/web/dist'

[[mounts]]
  source = 'racingshape_data'
  destination = '/data'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
